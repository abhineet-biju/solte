name: Rust checks
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.paths.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          PACKAGE_BASE: ${{ github.event.pull_request.base.sha }}
          PACKAGE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Include changes from failed or cancelled pushes.
          if [[ -z "$PACKAGE_BASE" ]]; then
            PACKAGE_BASE=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$PACKAGE_BRANCH" -f event=push -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty') || PACKAGE_BASE=''
          fi
          if [[ -z "$PACKAGE_BASE" ]] || ! git diff --no-renames --name-only -z "$PACKAGE_BASE" "$GITHUB_SHA" -- > "$RUNNER_TEMP/changed-paths"; then
            echo 'packages=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|AGENTS.md|docs/releases.md|docs/usage.md|docs/verification-*.md) ;;
              *) echo 'packages=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo 'packages=false' >> "$GITHUB_OUTPUT"
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source: ${{ github.sha }}
  packages:
    needs: [checks, changes]
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/package.yml
    with:
      source: ${{ github.sha }}
      source-ref: ${{ github.ref }}
      channel: check
